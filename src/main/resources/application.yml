spring:
  application:
    name: clientefacil

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/clientefacil}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:admin}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  # Dados de conexão com o broker RabbitMQ. Os defaults (localhost/guest) valem pra quando
  # a aplicação roda fora do Docker; dentro do docker-compose essas envs são sobrescritas
  # para apontar pro container "rabbitmq" (ver SPRING_RABBITMQ_* no docker-compose.yml).
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # Se o listener (NotificationListener) lançar exceção, tenta de novo até 3 vezes,
        # com backoff crescente (1s, depois 2s, depois 4s) antes de desistir da mensagem —
        # em vez do padrão do Spring AMQP, que reenfileira e tenta de novo imediatamente,
        # sem limite, martelando o listener e o broker indefinidamente.
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2
          max-interval: 10000
        # Depois de esgotar as tentativas acima, rejeita a mensagem sem reenfileirar — o
        # que, combinado com o x-dead-letter-exchange configurado na fila (RabbitMQConfig),
        # faz o RabbitMQ redirecionar a mensagem pra DLQ em vez de tentar pra sempre.
        default-requeue-rejected: false

springdoc:
  swagger-ui:
    persist-authorization: true

jwt:
  # Valor de exemplo abaixo, sobrescrito via env — mesmo padrão de mail.config.encryption-key.
  # Diferente dos outros segredos de dev deste arquivo, esse aqui também é verificado em runtime
  # (ver SecretConfigurationGuard): se o valor de exemplo ainda estiver ativo num perfil que pareça
  # produção (prod/production/staging), a aplicação recusa subir em vez de rodar exposta com um
  # segredo conhecido/versionado no repositório.
  secret: ${JWT_SECRET:12345678901234567890123456789012}
  expiration: 86400000

app:
  # Base do front (cliente-facil-next) usada pra montar os links de confirmação de e-mail e
  # recuperação de senha nos templates (ver UserService/AuthService). Mesmo padrão de override via
  # env dos outros valores de dev acima.
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}

mail:
  config:
    # Chave AES-256 usada para criptografar a senha SMTP salva em mail_config (ver
    # MailPasswordConverter) — precisa ter exatamente 32 bytes. Mesmo padrão do jwt.secret: valor
    # de dev aqui, sobrescrito via env em outros ambientes.
    encryption-key: ${MAIL_CONFIG_ENCRYPTION_KEY:12345678901234567890123456789012}
    # Usados só pelo MainSeeder para criar a config base (company_id NULL) no primeiro start,
    # caso ainda não exista uma — aponta pro MailHog (docker-compose) por padrão em dev, sem
    # autenticação nem TLS. Pode ser editado depois via PUT /api/v1/mail-configs/base.
    default:
      host: ${MAIL_DEFAULT_HOST:localhost}
      port: ${MAIL_DEFAULT_PORT:1025}
      from-name: ${MAIL_DEFAULT_FROM_NAME:Cliente Fácil}
      from-address: ${MAIL_DEFAULT_FROM_ADDRESS:no-reply@clientefacil.local}

server:
  port: ${SERVER_PORT:8080}

logging:
  file:
    name: logs/application.log
  level:
    root: INFO
    br.com.clientefacil: DEBUG

    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
