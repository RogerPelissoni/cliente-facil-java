<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Cliente Fácil — e-mail de teste</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f7; font-family:Arial, Helvetica, sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f7; padding:32px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="480" cellpadding="0" cellspacing="0"
                   style="background-color:#ffffff; border-radius:8px; overflow:hidden;">
                <tr>
                    <td style="background-color:#0f172a; padding:20px 24px;">
                        <span style="color:#ffffff; font-size:16px; font-weight:bold;">Cliente Fácil</span>
                    </td>
                </tr>
                <tr>
                    <td style="padding:24px;">
                        <h1 style="font-size:18px; color:#0f172a; margin:0 0 12px;">E-mail de teste</h1>
                        <p style="font-size:14px; color:#334155; line-height:1.5; margin:0 0 8px;">
                            Se você recebeu esta mensagem, a configuração de SMTP está funcionando corretamente.
                        </p>
                        <p style="font-size:12px; color:#94a3b8; margin:16px 0 0;">
                            Enviado em <span th:text="${sentAt}">01/01/2026 00:00:00</span>
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
