name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    # Mesmas imagens do docker-compose.yml (db/rabbitmq), com as credenciais padrão que
    # application.yml já assume via fallback (${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/clientefacil},
    # etc.) — zero env var extra necessária pro Spring Boot achar os dois serviços em localhost.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: clientefacil
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test
        run: ./mvnw -B test
